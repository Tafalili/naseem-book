<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8">

  <meta property="og:type" content="website">

  <meta property="og:title" content="كتاب نسيم | كتاب ذكريات طفلك الأول">
  <meta property="og:description" content="اصنعي كتاب ذكريات طفلك بصوره، ونطبعه ونجلّده يدوياً بعناية.">
  <meta property="og:url" content="https://naseem.tashahshop.com/">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole

  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="كتاب نسيم">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>كتاب نسيم</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FBF7F0; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: #3B3A36; transition: opacity .3s; z-index: 10; }
    #splash img { width: 72px; height: 72px; border-radius: 50%; }
    #splash p { margin: 0; font-size: 18px; }
    #splash i { width: 28px; height: 28px; border: 3px solid #D8E5E0; border-top-color: #6E9A8B;
      border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Shown while the app downloads on slow connections; removed on Flutter's first frame. -->
  <div id="splash"><img src="icons/Icon-192.png" alt=""><p>كتاب نسيم</p><i></i></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 350);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
